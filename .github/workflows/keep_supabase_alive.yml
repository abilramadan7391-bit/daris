name: Keep Supabase Alive

on:
  schedule:
    # Berjalan setiap 3 hari sekali pada jam 00:00 UTC (supaya Supabase tidak di-pause)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Dapat dipicu manual dari halaman GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API Endpoint
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "Error: Secrets VITE_SUPABASE_URL dan VITE_SUPABASE_ANON_KEY belum dikonfigurasi di Repository Settings -> Secrets."
            exit 1
          fi
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          
          echo "Supabase HTTP Response Code: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "Berhasil ping Supabase! Database tetap aktif."
          else
            echo "Gagal memanggil Supabase REST API."
            exit 1
          fi
