name: Keep Supabase Alive

on:
  schedule:
    # Berjalan setiap 3 hari sekali pada jam 00:00 UTC (supaya Supabase tidak di-pause)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Dapat dipicu manual dari halaman GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API Endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: Secrets VITE_SUPABASE_URL atau VITE_SUPABASE_ANON_KEY belum terisi di Settings -> Secrets."
            exit 1
          fi
          
          # Bersihkan trailing slash dari URL jika ada
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed 's/\/*$//')
          
          echo "Memanggil endpoint: $CLEAN_URL/rest/v1/"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$CLEAN_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          echo "Supabase HTTP Response Code: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "Berhasil ping Supabase! Database tetap aktif."
          else
            echo "Gagal memanggil Supabase REST API (HTTP Status Code: $RESPONSE)."
            exit 1
          fi
