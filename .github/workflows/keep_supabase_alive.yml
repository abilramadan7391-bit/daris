name: Keep Supabase Alive

on:
  schedule:
    # Berjalan setiap 3 hari sekali pada jam 00:00 UTC (supaya Supabase tidak di-pause)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Dapat dipicu manual dari halaman GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API Endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "Checking Secret lengths..."
          echo "URL length: ${#SUPABASE_URL}"
          echo "KEY length: ${#SUPABASE_ANON_KEY}"
          
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets VITE_SUPABASE_URL atau VITE_SUPABASE_ANON_KEY masih kosong! Pastikan ditambahkan di Repository Secrets."
            exit 1
          fi
          
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed -e 's/[[:space:]]*$//' -e 's/\/*$//')
          echo "Target URL: $CLEAN_URL/auth/v1/health"
          
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X GET "$CLEAN_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          echo "HTTP Response Status Code: $HTTP_STATUS"
          echo "Response Body:"
          cat response.txt || true
          echo ""
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Ping Supabase BERHASIL! Database dipastikan tetap AKTIF."
          else
            echo "::error::Gagal memanggil Supabase API (HTTP Code: $HTTP_STATUS)."
            exit 1
          fi
